# fly.toml app configuration file generated for capital-region-feed
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "capital-region-feed"
primary_region = "ewr"

[build]

[env]
  FEEDGEN_HOSTNAME = "capital-region-feed.fly.dev"
  HOSTNAME = "capital-region-feed.fly.dev"
  FEED_URI = "at://did:plc:xndplob7sicvv6balxdzh3jk/app.bsky.feed.generator/aaagkkw3yejuk"
  SERVICE_DID = "did:web:capital-region-feed.fly.dev"
  DATABASE_PATH = "/data/feed_database.db"
  IGNORE_REPLY_POSTS = "true"
  IGNORE_ARCHIVED_POSTS = "true"
  POST_RETENTION_DAYS = "7"
  JETSTREAM_URL = "wss://jetstream2.us-east.bsky.network/subscribe"
  PORT = "8080"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # Uvicorn + Peewee import can exceed 20s on a cold shared-cpu machine; a short
    # grace makes Fly mark the proxy unhealthy and AppView fails did:web resolve.
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "feed_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
